<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyanobacteria Prediction</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.0.0/build/stlite.css">
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.0.0/build/stlite.js";
    mount({
      requirements: ["pandas", "numpy", "scikit-learn", "plotly", "openpyxl", "joblib"],
      entrypoint: "dashboard.py",
      files: {
        "dashboard.py": { url: "./dashboard.py" },
        "config.py": { url: "./config.py" },
        "features.py": { url: "./features.py" },
        "predict.py": { url: "./predict.py" },
        "style.css": { url: "./style.css" },
        "talab.xlsx": { url: "./talab.xlsx" },
        "models/cyanobacteria_model.pkl": { url: "./models/cyanobacteria_model.pkl" }
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
